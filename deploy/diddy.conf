# Diddy configuration. Restart after editing: systemctl restart diddy
# This file contains database passwords: keep it root-only (chmod 640).
[diddy]
listen = 0.0.0.0
port = 8080
data_dir = /var/lib/diddy

# true = write config files but do NOT reload BIND/Kea (safe for trying it out)
dry_run = false

# Defaults for new DNS zones (SOA)
default_ns = ns1.corp.local
default_admin_email = hostmaster@corp.local

# ---- Diddy database (mysql | sqlite)
db_backend = mysql
mysql_host = __DB_HOST__
mysql_port = __DB_PORT__
mysql_user = __DB_USER__
mysql_password = __DB_PASS__
mysql_database = __DB_NAME__
# optional prefix for Diddy's own tables, e.g. ddi_ -> ddi_networks
table_prefix = __TABLE_PREFIX__

# ---- Kea lease storage (mysql | memfile)
kea_lease_backend = __KEA_LEASE_BACKEND__
kea_db_host = __KEA_DB_HOST__
kea_db_port = __DB_PORT__
kea_db_name = __KEA_DB_NAME__
kea_db_user = __KEA_DB_USER__
kea_db_password = __KEA_DB_PASS__
# used only when kea_lease_backend = memfile
kea_lease_file = /var/lib/kea/kea-leases4.csv

# ---- DDNS (client DHCP didaftarkan ke DNS dari tabel lease)
# TTL record dinamis, dan interval refresh zona dalam detik (0 = matikan)
ddns_ttl = 60
ddns_refresh_interval = 60

# ---- dnsdist (proxy lokal untuk upstream DoT/DoH, dipakai bila upstream mode = encrypted)
dnsdist_conf = /etc/dnsdist/dnsdist.conf
dnsdist_service = dnsdist
dnsdist_listen = 127.0.0.1
dnsdist_port = 5353

# ---- deteksi drift: file service vs config terakhir yang di-deploy
# interval cek dalam detik (0 = matikan), dan apakah file yang berubah dikembalikan otomatis
drift_check_interval = 300
drift_auto_repair = false

# ---- statistik dashboard
# sampel tiap metrics_interval detik (0 = matikan), disimpan metrics_retention_days hari
metrics_interval = 60
metrics_retention_days = 7
# statistics-channel BIND; bind_stats_manage = false bila kamu sudah punya statistics-channels sendiri
bind_stats_url = http://127.0.0.1:8053
bind_stats_manage = true
# kapasitas acuan untuk widget DNS utilization (query per detik)
dns_capacity_qps = 1000

# ---- BIND9
bind_dir = /etc/bind/diddy
# file yang di-include dari dalam blok options{} named.conf.options (resolver & forwarder)
bind_options_file = /etc/bind/diddy/named.conf.options.diddy
dns_reload_cmd = rndc reload
dns_service = named

# ---- ISC Kea DHCPv4
kea_conf = /etc/kea/kea-dhcp4.conf
kea_socket = /run/kea/kea4-ctrl-socket
kea_reload_fallback_cmd = systemctl restart kea-dhcp4-server
dhcp_service = kea-dhcp4-server
# Interfaces Kea listens on, comma separated (e.g. ens18,ens19). * = all
dhcp_interfaces = *
